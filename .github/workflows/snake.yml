# Optional: regenerates assets/snake-*.svg on the `output` branch.
#
# Disabled by default — the SVG assets are committed and refreshed by
# `python scripts/gen_snake.py Sakamuraa --out assets` instead. GitHub
# Actions is currently blocked on this account by a billing lock, so
# automatic runs would only fail. Fix Billing -> re-enable the triggers.
name: Generate contribution snake

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
